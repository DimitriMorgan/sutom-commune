server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # /sitemap.xml servi directement par Symfony (le controller fait #[Route('/sitemap.xml')]).
    location = /sitemap.xml {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;
    }

    location /api {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;
    }

    location /index.php {
        root /var/www/backend/public;
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param HTTPS off;
    }

    # /robots.txt, /favicon.svg, /og-default.svg, /manifest.webmanifest sont servis par
    # le serveur Vite (qui sert /public/* en dev et fait pareil au build).
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
