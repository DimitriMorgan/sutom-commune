services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sutom_commune}
      POSTGRES_USER: ${POSTGRES_USER:-sutom_commune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sutom_commune}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sutom_commune} -d ${POSTGRES_DB:-sutom_commune}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-change-me-in-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sutom_commune:sutom_commune@db:5432/sutom_commune?serverVersion=17&charset=utf8}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5178}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8081}
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
      - backend_var:/var/www/backend/var
    depends_on:
      db:
        condition: service_healthy
    command: sh -lc "composer install --no-interaction --prefer-dist && php-fpm"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-Sutom-Commune}
      VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8081}
      VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5178}:5173"
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backend_vendor:
  backend_var:
  frontend_node_modules:
